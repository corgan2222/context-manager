[workspace]
members = ["ctxmenu"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

# Zentral gepflegt, damit die spätere IExplorerCommand-DLL (ToDo Abschnitt 14)
# ohne Versionsdrift danebengesetzt werden kann.
[workspace.dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.36.1"
windows-registry = "0.6.1"
windows-result = "0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "6"
rustc-hash = "2"

[workspace.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Environment",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
